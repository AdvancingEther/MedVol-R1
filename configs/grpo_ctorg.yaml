data:
  train_files: data/ctorg/verl_parquet/ctorg_refseg_verl_train.parquet
  val_files: data/ctorg/verl_parquet/ctorg_refseg_verl_train.parquet
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 17500
  max_response_length: 2048
  rollout_batch_size: 2
  mini_rollout_batch_size: null
  val_batch_size: 1
  format_prompt: null
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 65536
  max_pixels: 65536
  filter_overlong_prompts: false
algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: outputs/merged/ctorg_sft
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 128
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw_bf16
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    max_num_batched_tokens: 20000
    n: 4
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.65
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: true
  reward:
    reward_function: third_party/EasyR1/examples/reward_function/ctorg.py:compute_score
    num_gpus: 1
trainer:
  total_epochs: 3
  max_steps: null
  project_name: MedVol-R1
  experiment_name: ctorg_grpo_lora
  logger:
  - console
  nnodes: 1
  n_gpus_per_node: 2
  max_try_make_batch: 20
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 0
  save_freq: 20
  save_limit: 5
  save_model_only: false
  save_checkpoint_path: checkpoints/rl/ctorg
  load_checkpoint_path: null
  find_last_checkpoint: false
